<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temperature Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <h1>Temperature converter</h1>
    <p class="card__intro">Enter a temperature, pick its unit, and see it in Celsius, Fahrenheit, and Kelvin.</p>

    <form id="converter" novalidate>
      <div class="field">
        <label for="temp">Temperature</label>
        <input id="temp" name="temp" type="text" inputmode="decimal" autocomplete="off" placeholder="For example 36.6" aria-describedby="error">
      </div>

      <div class="field">
        <label for="unit">Unit</label>
        <select id="unit" name="unit">
          <option value="C">Celsius (°C)</option>
          <option value="F">Fahrenheit (°F)</option>
          <option value="K">Kelvin (K)</option>
        </select>
      </div>

      <p id="error" class="error" role="alert" hidden></p>

      <button type="submit" class="convert">Convert</button>
    </form>

    <section class="results" aria-live="polite">
      <div class="gauge" aria-hidden="true">
        <div class="gauge__tube">
          <div id="fill" class="gauge__fill"></div>
        </div>
        <div class="gauge__bulb"></div>
      </div>

      <div class="results__body">
        <p id="empty" class="results__empty">Your results will show here.</p>
        <dl id="output" class="output" hidden>
          <div class="output__row" data-unit="C">
            <dt>Celsius</dt>
            <dd id="out-c"></dd>
          </div>
          <div class="output__row" data-unit="F">
            <dt>Fahrenheit</dt>
            <dd id="out-f"></dd>
          </div>
          <div class="output__row" data-unit="K">
            <dt>Kelvin</dt>
            <dd id="out-k"></dd>
          </div>
        </dl>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
